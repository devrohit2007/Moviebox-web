<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>MovieBox Web</title>
<style>
:root{
  --bg:#0b0b0f;--bg2:#141419;--panel:#1b1b22;--panel2:#26262f;--text:#f4f4f6;--mute:#a4a4b2;
  --red:#e50914;--red2:#b20710;--r:10px;--card:128px;--pad:4vw;--hero-h:72vh;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media(min-width:700px){:root{--card:168px;--pad:3.2vw;--hero-h:78vh}}
@media(min-width:1400px){:root{--card:216px;--pad:3vw;font-size:19px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
img{display:block}

/* ---------- header ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px var(--pad);
  background:linear-gradient(180deg,rgba(11,11,15,.92),rgba(11,11,15,0));transition:background .25s}
header.solid{background:rgba(11,11,15,.97);box-shadow:0 2px 14px rgba(0,0,0,.5)}
.logo{font-weight:900;font-size:21px;letter-spacing:.06em;color:var(--red);cursor:pointer;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.nav{display:flex;gap:4px}
.nav a{padding:7px 12px;border-radius:99px;color:#e6e6ea;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.nav a.on{background:rgba(255,255,255,.14)}
.sp{flex:1}
#q{width:min(320px,48vw);min-width:0;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:8px 14px;outline:none;transition:border-color .2s,width .25s}
#q:focus{border-color:#fff;width:min(420px,60vw)}
@media(max-width:600px){.nav a.t{display:none}#q{flex:1;width:auto}#q:focus{width:auto}.sp{display:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:6px;padding:10px 24px;font-weight:700;font-size:1rem;
  background:#fff;color:#000;transition:transform .15s var(--ease),background .2s}
.btn:hover{background:rgba(255,255,255,.82)}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red2)}
.btn.ghost{background:rgba(109,109,122,.7);color:#fff}.btn.ghost:hover{background:rgba(109,109,122,.5)}
.btn.sm{padding:7px 14px;font-size:.88rem;font-weight:600}

/* ---------- hero ---------- */
.hero{position:relative;height:var(--hero-h);min-height:420px;max-height:880px;overflow:hidden;background:var(--bg2)}
.hero .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:0;transition:opacity .9s ease}
.hero .layer.on{opacity:1}
.hero.poster-only .layer{opacity:0;object-position:center 15%}
.hero.poster-only .layer.on{opacity:.62}
.hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(77deg,rgba(11,11,15,.92) 0%,rgba(11,11,15,.55) 38%,rgba(11,11,15,0) 70%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;z-index:1;
  background:linear-gradient(180deg,rgba(11,11,15,0),var(--bg))}
.hero-body{position:absolute;z-index:2;left:var(--pad);bottom:22%;width:min(560px,86vw)}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.18em;color:#d8d8e0;text-transform:uppercase;margin-bottom:10px}
.kicker b{color:var(--red)}
.hero-title{margin:0 0 10px;font-size:clamp(30px,5.4vw,66px);line-height:1.02;font-weight:900;letter-spacing:-.02em;text-shadow:0 3px 24px rgba(0,0,0,.6)}
.hero-meta{display:flex;gap:12px;align-items:center;color:#d8d8e0;font-weight:600;font-size:.95rem;margin-bottom:12px;flex-wrap:wrap}
.hero-meta .rt{color:#46d369}
.hero-desc{margin:0 0 20px;color:#e2e2e8;font-size:clamp(.9rem,1.5vw,1.12rem);text-shadow:0 1px 10px rgba(0,0,0,.7);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.dots{position:absolute;z-index:3;right:var(--pad);bottom:24%;display:flex;gap:7px}
.dots i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);cursor:pointer;transition:background .3s,width .3s}
.dots i.on{background:#fff;width:34px}
@media(max-width:600px){.hero-body{bottom:20%}.dots{bottom:11%}.hero-desc{-webkit-line-clamp:2}}

/* ---------- rows / cards ---------- */
#rows{position:relative;z-index:3;margin-top:-9vh}
.rowt{margin:0 var(--pad);padding:18px 0 4px;font-size:clamp(1rem,1.6vw,1.35rem);font-weight:700}
.rowwrap{position:relative}
.row{display:flex;gap:clamp(6px,.8vw,12px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:18px var(--pad) 26px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-left:var(--pad)}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 var(--card);scroll-snap-align:start}
.arrow{position:absolute;top:18px;bottom:26px;width:var(--pad);min-width:42px;border:0;background:rgba(11,11,15,.7);color:#fff;font-size:1.8rem;opacity:0;transition:opacity .2s;z-index:4;display:none}
.arrow.l{left:0}.arrow.r{right:0}
@media(hover:hover){.arrow{display:block}.rowwrap:hover .arrow{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card),1fr));gap:clamp(10px,1.4vw,20px);padding:18px var(--pad)}

.card{position:relative;min-width:0;cursor:pointer;border-radius:var(--r);transition:transform .22s var(--ease),box-shadow .22s var(--ease);transform-origin:center}
.ph{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--panel)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.ph img.ld{opacity:1}
.badge{position:absolute;top:7px;left:7px;z-index:2;background:rgba(0,0,0,.72);border-radius:4px;padding:2px 7px;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.rate{position:absolute;top:7px;right:7px;z-index:2;background:rgba(0,0,0,.72);border-radius:4px;padding:2px 7px;font-size:.7rem;font-weight:700;color:#ffd166}
.ov{position:absolute;inset:auto 0 0 0;z-index:2;padding:34px 10px 10px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92));opacity:0;transition:opacity .2s}
.ov b{display:block;font-size:.88rem;line-height:1.2;margin-bottom:3px}
.ov span{font-size:.75rem;color:var(--mute)}
.pl{position:absolute;z-index:2;left:50%;top:42%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(229,9,20,.92);
  display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .2s,transform .2s var(--ease);font-size:18px;padding-left:3px}
.cap{display:none;padding:7px 2px 0;min-width:0;overflow:hidden}
.cap b{display:block;font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap span{font-size:.72rem;color:var(--mute)}
@media(hover:none){.cap{display:block}}
@media(hover:hover){
  .card:hover{transform:scale(1.07) translateY(-3px);z-index:6;box-shadow:0 14px 34px rgba(0,0,0,.65)}
  .card:hover .ov,.card:hover .pl{opacity:1}.card:hover .pl{transform:scale(1)}
}
.card:focus-visible{transform:scale(1.07);z-index:6;outline-offset:2px;box-shadow:0 14px 34px rgba(0,0,0,.65)}
.card:focus-visible .ov,.card:focus-visible .pl{opacity:1}.card:focus-visible .pl{transform:scale(1)}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.28);z-index:3}
.prog i{display:block;height:100%;background:var(--red)}
.card .x{position:absolute;right:6px;top:30px;z-index:4;background:rgba(0,0,0,.75);border:0;border-radius:50%;width:26px;height:26px;line-height:1;color:#fff}

/* ---------- skeletons ---------- */
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.sk{background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:var(--r)}
.sk-hero{height:var(--hero-h);min-height:420px;border-radius:0}
.sk-row{display:flex;gap:12px;padding:6px var(--pad) 20px;overflow:hidden}
.sk-row .sk{flex:0 0 var(--card);aspect-ratio:2/3}
.sk-t{height:18px;width:180px;margin:20px var(--pad) 0}
@media(prefers-reduced-motion:reduce){.sk{animation:none}*{transition-duration:.01ms!important}}

/* ---------- misc ---------- */
.sec{margin:0;padding:92px var(--pad) 0;font-size:clamp(1.1rem,2vw,1.6rem);font-weight:800}
.sec small{color:var(--mute);font-weight:500;margin-left:8px;font-size:.6em}
.msg{padding:90px var(--pad) 40px;text-align:center;color:var(--mute)}
.more{height:60px;text-align:center;color:var(--mute);padding-top:18px}
main{min-height:100vh;padding-bottom:60px}
#detail{display:none}

/* ---------- details ---------- */
.dt{position:relative;overflow:hidden;padding:110px var(--pad) 30px;min-height:56vh}
.dt-bg{position:absolute;inset:0;z-index:0}
.dt-bg img{width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:.35}
.dt-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.55),var(--bg) 96%),linear-gradient(90deg,rgba(11,11,15,.9),rgba(11,11,15,.2))}
.dt-in{position:relative;z-index:1;display:flex;gap:clamp(16px,3vw,40px);flex-wrap:wrap;align-items:flex-start}
.dt-in>.ph{width:clamp(130px,22vw,300px);flex:0 0 auto;box-shadow:0 18px 50px rgba(0,0,0,.7)}
.dt-info{flex:1;min-width:260px;max-width:820px}
.dt-info h2{margin:0 0 8px;font-size:clamp(1.7rem,4vw,3.2rem);line-height:1.05;font-weight:900;letter-spacing:-.02em}
.chips{display:flex;gap:10px;flex-wrap:wrap;color:#d8d8e0;font-weight:600;font-size:.92rem;margin-bottom:12px}
.chips .rt{color:#46d369}
.tag{color:var(--mute);font-style:italic;margin-bottom:8px}
.desc{color:#dcdce4;margin:10px 0 14px;font-size:1.02rem}
.cast{color:var(--mute);font-size:.88rem;margin-bottom:8px}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
select{background:rgba(40,40,50,.95);border:1px solid #3a3a46;border-radius:6px;padding:9px 12px}
.seasons{padding:8px var(--pad) 0}
.seasons h3{margin:14px 0 8px;font-size:1.25rem}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:12px}
.eps button{background:var(--panel);border:1px solid #2f2f3a;border-radius:6px;padding:11px 0;font-weight:600;position:relative;transition:background .15s,transform .15s}
.eps button.seen{color:var(--mute)}
.eps button.seen::after{content:"✓";position:absolute;top:1px;right:5px;font-size:10px;color:#46d369}
.eps button:hover,.eps button.cur{background:var(--red);border-color:var(--red);color:#fff}
.eps button:hover{transform:translateY(-2px)}

/* ---------- player ---------- */
#player{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
#player .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:linear-gradient(180deg,#000,#0b0b0f);flex-wrap:wrap}
#player .bar .ttl{flex:1;min-width:120px;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player video{flex:1;width:100%;min-height:0;background:#000}
#pmsg{white-space:pre-wrap;word-break:break-word;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#eee;pointer-events:none;padding:0 20px;text-shadow:0 1px 6px #000;font-size:1.05rem}
video::cue{background:rgba(0,0,0,.65);font-size:1.15em}
.ctl{justify-content:center}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mute)}
.nav a .ic{display:none}
@media(max-width:600px){.nav a.ico .lbl{display:none}.nav a.ico .ic{display:inline}.nav a{padding:6px 7px;font-size:13px}header{gap:8px}.logo{font-size:16px}#q{min-width:90px;padding:7px 10px}}

/* ---------- provider picker (inside the player) ---------- */
#pman{display:none;position:absolute;left:0;right:0;top:56px;bottom:56px;z-index:5;overflow:auto;background:rgba(0,0,0,.88);padding:18px var(--pad)}
.pm-in{max-width:640px;margin:0 auto}
.pm-in h3{margin:0 0 14px;font-size:1.1rem;font-weight:700}
.pm-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pm-row input{flex:1;min-width:140px;background:rgba(40,40,50,.95);border:1px solid #3a3a46;border-radius:6px;padding:9px 12px}
#pmr{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
#pmr button{text-align:left;background:var(--panel);border:1px solid #2f2f3a;border-radius:6px;padding:10px 12px;color:var(--text)}
#pmr button:hover{background:var(--red);border-color:var(--red)}
#pmr small{color:var(--mute);margin-left:6px}

/* ---------- live TV ---------- */
.tvbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px var(--pad) 0}
.tvbar input{flex:1;min-width:160px;max-width:420px;background:rgba(40,40,50,.95);border:1px solid #3a3a46;border-radius:6px;padding:9px 12px}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:18px var(--pad)}
.ch{background:var(--panel);border-radius:var(--r);padding:12px 8px;text-align:center;cursor:pointer;min-width:0;transition:transform .2s var(--ease),background .2s}
.ch:hover,.ch:focus-visible{transform:translateY(-3px);background:var(--panel2)}
.ch .lg{height:54px;display:grid;place-items:center;margin-bottom:8px;font-size:1.6rem;font-weight:800;color:var(--mute)}
.ch .lg img{max-width:100%;max-height:54px;object-fit:contain;margin:0 auto}
.ch b{display:block;font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch span{font-size:.7rem;color:var(--mute)}

/* ---------- settings ---------- */
dialog#cfg{background:var(--bg2);color:var(--text);border:1px solid #33333f;border-radius:14px;padding:0;width:min(560px,94vw);max-height:90vh}
dialog#cfg::backdrop{background:rgba(0,0,0,.7)}
.cf{padding:20px;display:flex;flex-direction:column;gap:14px}
.cf h3{margin:0;font-size:1.2rem}
.cf label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.cf small{display:block;color:var(--mute);font-size:.78rem;margin-top:3px;font-weight:400}
.cf textarea,.cf input[type=text]{width:100%;background:rgba(40,40,50,.95);border:1px solid #3a3a46;border-radius:6px;padding:9px 12px;font-size:.88rem}
.cf .pl-row{display:flex;gap:10px;align-items:center;padding:6px 0}
.cf .pl-row span{color:var(--mute);font-size:.78rem}
.cf .bt{display:flex;gap:10px;justify-content:flex-end;align-items:center}
#cfmsg{flex:1;color:#46d369;font-size:.85rem}
</style>
</head>
<body>
<header id="hdr">
  <div class="logo" id="logo" tabindex="0">MovieBox</div>
  <nav class="nav"><a id="nHome" class="t on">Home</a><a id="navfav">My List</a><a id="nTv" class="ico" tabindex="0"><span class="lbl">Live TV</span><span class="ic">📺</span></a><a id="gear" tabindex="0" title="Sources &amp; settings">⚙</a></nav>
  <div class="sp"></div>
  <input id="q" type="search" placeholder="Search movies, shows, anime…" enterkeyhint="search" autocomplete="off">
</header>

<main>
  <section id="list"></section>
  <section id="detail"></section>
</main>

<div id="player">
  <div class="bar">
    <button class="btn ghost sm" id="pclose">← Back</button>
    <div class="ttl" id="ptitle"></div>
    <select id="pstream" title="Source / quality"></select>
    <button class="btn ghost sm" id="pprov" title="Try another provider">⇄ Provider</button>
    <select id="psub" title="Subtitles"><option value="-1">Subtitles: loading…</option></select>
    <button class="btn ghost sm" id="pnext" style="display:none">Next ▶</button>
  </div>
  <video id="video" controls playsinline></video>
  <div id="pmsg"></div>
  <div id="pman"><div class="pm-in">
    <h3 id="pmh"></h3>
    <div class="pm-row" id="pmsw"></div>
    <div class="pm-row"><select id="pmp" title="Provider"></select><input id="pmq" type="search" placeholder="Title to search" autocomplete="off"><button class="btn red sm" id="pmgo">Search</button></div>
    <div id="pmr"></div>
    <button class="btn ghost sm" id="pmx">Close</button>
  </div></div>
  <div class="bar ctl">
    <button class="btn ghost sm" data-seek="-10">⏪ 10</button>
    <button class="btn ghost sm" data-seek="10">10 ⏩</button>
    <button class="btn ghost sm" data-seek="85">Skip intro +85s</button>
    <select id="pspeed" title="Speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
    <label class="chk"><input type="checkbox" id="pauto"> Auto-next</label>
    <button class="btn ghost sm" id="pfs">⛶</button>
  </div>
</div>

<dialog id="cfg"><div class="cf">
  <h3>Sources &amp; settings</h3>
  <div><label>Providers <small>Turn off the ones you don't want used.</small></label><div id="cfprov"></div></div>
  <div><label for="cfpref">Play from first</label><select id="cfpref"></select></div>
  <div><label for="cfmiss">If that provider does not have the title</label><select id="cfmiss"><option value="ask">Ask me which provider to switch to</option><option value="auto">Try the other providers automatically</option></select><small>If a source is found but will not play, the app always switches by itself.</small></div>
  <div><label for="cfadd">Stremio addons (optional)</label><textarea id="cfadd" rows="3" placeholder="https://…/manifest.json — one per line"></textarea><small>Addons that serve direct links. Torrent-only addons can't play in a browser.</small></div>
  <div><label for="cftv">Live TV playlists (optional)</label><textarea id="cftv" rows="3" placeholder="https://…/playlist.m3u — one per line"></textarea><small>Opens under “Live TV”.</small></div>
  <div><label for="cf4k">4KHDHub address (only if the site moves)</label><input type="text" id="cf4k" placeholder="https://4khdhub.one/"></div>
  <div class="bt"><span id="cfmsg"></span><button class="btn ghost sm" id="cfx">Close</button><button class="btn red sm" id="cfsave">Save</button></div>
</div></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(_){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
};
async function api(path){
  const r = await fetch(path);
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(j.error || ('HTTP ' + r.status)); e.diag = j.diag; throw e; }
  return j;
}
const loadScript = (() => { const done = {}; return src => done[src] ||= new Promise((ok, no) => {
  const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Could not load ' + src)); document.head.appendChild(s); }); })();
const fmtT = t => { t = Math.max(0, t | 0); const h = t / 3600 | 0, m = (t % 3600) / 60 | 0, s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };

/* ---------- image sizing: ask the server for thumbnails sized to this screen ---------- */
const VW = window.innerWidth;
const PW = VW >= 1400 ? 480 : 320;                 // poster thumbnail width
const HW = VW >= 1400 ? 1920 : VW >= 700 ? 1280 : 780;  // hero / backdrop width
const im = (u, w) => !u ? '' : u.startsWith('/img?') ? u + '&w=' + w : u;
// fade images in once decoded (one capture listener instead of per-image handlers)
document.addEventListener('load', e => { if(e.target.tagName === 'IMG') e.target.classList.add('ld'); }, true);
document.addEventListener('error', e => { if(e.target.tagName === 'IMG' && e.target.closest('.ph')) e.target.style.display = 'none'; }, true);

/* ---------- saved data (this device) ---------- */
const favs = () => ls.get('mb_fav', {});
const hist = () => ls.get('mb_hist', {});
const seen = () => ls.get('mb_seen', {});
const isFav = id => !!favs()[id];

function card(i, extra = {}){
  const pct = extra.pct ? `<div class="prog"><i style="width:${extra.pct}%"></i></div>` : '';
  const sub = extra.sub || [i.year, i.rating ? '★ ' + i.rating : ''].filter(Boolean).join('  ·  ');
  return `<div class="card" tabindex="0" data-id="${esc(i.id)}" ${extra.go ? `data-go="${esc(extra.go)}"` : ''}>
    <div class="ph">
      <img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(im(i.poster, PW))}" alt="">
      <span class="badge">${extra.badge || (i.type === 'series' ? 'Series' : 'Movie')}</span>
      ${i.rating && !extra.pct ? `<span class="rate">★ ${esc(i.rating)}</span>` : ''}
      <div class="ov"><b>${esc(i.title)}</b><span>${esc(sub)}</span></div>
      <div class="pl">▶</div>${pct}
      ${extra.remove ? '<button class="x" data-rm="1" title="Remove">✕</button>' : ''}
    </div>
    <div class="cap"><b>${esc(i.title)}</b><span>${esc(extra.sub || i.year)}</span></div></div>`;
}
const rowHTML = (title, cards) => `<div class="rowt">${esc(title)}</div><div class="rowwrap">
  <button class="arrow l" tabindex="-1" aria-label="Scroll left">‹</button><div class="row">${cards}</div><button class="arrow r" tabindex="-1" aria-label="Scroll right">›</button></div>`;
const grid = items => items.length ? '<div class="grid">' + items.map(i => card(i)).join('') + '</div>' : '<div class="msg" style="padding-top:20px">Nothing here.</div>';
const skRows = n => Array.from({length: n}, () => `<div class="sk sk-t"></div><div class="sk-row">${'<div class="sk"></div>'.repeat(8)}</div>`).join('');
const skHome = () => `<div class="sk sk-hero"></div><div style="margin-top:-6vh">${skRows(3)}</div>`;

/* ---------- hero ---------- */
let H = {items: [], i: 0, timer: 0, layer: 0};
function stopHero(){ clearInterval(H.timer); H.timer = 0; }
function startHero(){
  stopHero();
  if(H.items.length < 2 || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  H.timer = setInterval(() => { if(!document.hidden && $('#player').style.display === 'none') setHero((H.i + 1) % H.items.length); }, 9000);
}
function heroHTML(){
  return `<div class="hero" id="hero"><img class="layer" id="hl0" alt="" decoding="async" referrerpolicy="no-referrer"><img class="layer" id="hl1" alt="" decoding="async" referrerpolicy="no-referrer">
    <div class="hero-body"><div class="kicker" id="hk"></div><h1 class="hero-title" id="ht"></h1><div class="hero-meta" id="hm"></div>
    <p class="hero-desc" id="hd"></p><div class="hero-actions"><button class="btn" id="hp">▶ Play</button><button class="btn ghost" id="hi">ⓘ More Info</button></div></div>
    <div class="dots" id="hdots"></div></div>`;
}
function setHero(i){
  const it = H.items[i]; if(!it) return; H.i = i;
  const hero = $('#hero'); if(!hero) return;
  const src = it.backdrop || it.poster;
  hero.classList.toggle('poster-only', !it.backdrop);
  const next = H.layer ^ 1, a = $('#hl' + next), b = $('#hl' + H.layer);
  a.onload = () => { a.classList.add('on'); if(b !== a) b.classList.remove('on'); };
  a.src = im(src, HW); H.layer = next;
  if(a.complete && a.naturalWidth){ a.classList.add('on'); b.classList.remove('on'); }
  $('#hk').innerHTML = `<b>${it.type === 'series' ? 'SERIES' : 'FILM'}</b> &nbsp;·&nbsp; FEATURED`;
  $('#ht').textContent = it.title;

    it._d = 1; api('/api/details?id=' + encodeURIComponent(it.id)).then(d => { it.description = d.description || ''; if(H.items[H.i] === it) $('#hd').textContent = it.description; }).catch(() => {});

}

let rowObs = null;
async function showHome(){
  showView('list'); setNav();
  const h = hist(), cont = Object.values(h).sort((a, b) => b.ts - a.ts);
  const contHTML = cont.length ? rowHTML('Continue watching', cont.map(c => card(c, {
    pct: c.dur ? Math.min(100, c.t / c.dur * 100) : 0, remove: true,
    badge: c.type === 'series' ? `S${c.se} E${c.ep}` : 'Resume', sub: fmtT(c.t) + ' watched', go: `${c.se}/${c.ep}`})).join('')) : '';
  $('#list').innerHTML = skHome();
  let r;
  try{ r = await api('/api/home?lite=1'); }
  catch(e){ $('#list').innerHTML = `<div class="msg">${esc(e.message)}<br><br><button class="btn red" onclick="route()">Retry</button></div>`; return; }
  if(location.hash && location.hash !== '#/' && location.hash !== '#') return;   // user already navigated away
  const secs = (r.sections && r.sections.length) ? r.sections : [{title: 'Trending', items: r.items || []}];
  const feat = secs.find(s => s.featured);
  H.items = (feat ? feat.items : secs[0].items).slice(0, 6);
  const rest = secs.filter(s => s !== feat && s.items.length);
  $('#list').innerHTML = (H.items.length ? heroHTML() : '<div style="height:140px"></div>') + '<div id="rows"></div>';
  if(H.items.length){ H.layer = 0; setHero(0); startHero(); }
  // render rows progressively: 3 now, more as the user scrolls (keeps the DOM small on weak devices)
  const box = $('#rows'); box.insertAdjacentHTML('beforeend', contHTML);
  let n = 0; const step = 3;
  const more = () => {
    rest.slice(n, n + step).forEach(s => box.insertAdjacentHTML('beforeend', rowHTML(s.title, s.items.map(i => card(i)).join(''))));
    n += step; if(n >= rest.length && rowObs){ rowObs.disconnect(); sentinel.remove(); }
  };
  const sentinel = document.createElement('div'); sentinel.style.height = '1px'; $('#list').appendChild(sentinel);
  more();
  if('IntersectionObserver' in window && rest.length > step){
    rowObs && rowObs.disconnect();
    rowObs = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)) more(); }, {rootMargin: '900px'});
    rowObs.observe(sentinel);
  }else{ while(n < rest.length) more(); }
}
async function showSearch(q){
  showView('list'); setNav(); $('#q').value = q;
  $('#list').innerHTML = `<h2 class="sec">Results for “${esc(q)}”</h2><div class="sk-row" style="padding-top:20px">${'<div class="sk"></div>'.repeat(8)}</div>`;
  let page = 1, done = false, busy = false;
  try{
    const {items} = await api('/api/search?q=' + encodeURIComponent(q));
    $('#list').innerHTML = `<h2 class="sec">Results for “${esc(q)}”</h2>` + grid(items) + '<div class="more" id="more"></div>';
    done = items.length < 12;
    const seenIds = new Set(items.map(i => i.id));
    const sentinel = $('#more');
    const loadMore = async () => {   // pagination: next page when the user reaches the bottom
      if(busy || done) return; busy = true; sentinel.textContent = 'Loading…';
      try{
        const r = await api(`/api/search?q=${encodeURIComponent(q)}&page=${++page}`);
        const fresh = r.items.filter(i => !seenIds.has(i.id)); fresh.forEach(i => seenIds.add(i.id));
        if(fresh.length) $('#list .grid').insertAdjacentHTML('beforeend', fresh.map(i => card(i)).join(''));
        if(!fresh.length || page >= 8) done = true;
      }catch(_){ done = true; }
      sentinel.textContent = ''; busy = false;
    };
    if('IntersectionObserver' in window){
      const io = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)){ loadMore().then(() => { if(done) io.disconnect(); }); } }, {rootMargin: '600px'});
      io.observe(sentinel);
    }
  }catch(e){ $('#list').innerHTML = `<div class="msg">${esc(e.message)}<br><br><button class="btn red" onclick="route()">Retry</button></div>`; }
}

/* ---------- player ---------- */
const video = $('#video');
let dashP = null, hlsP = null, P = null, playToken = 0, lastSave = 0;
$('#pauto').checked = ls.get('mb_auto', true);
$('#pauto').onchange = e => ls.set('mb_auto', e.target.checked);

function destroyEngines(){
  if(dashP){ try{ dashP.reset(); }catch(_){} dashP = null; }
  if(hlsP){ try{ hlsP.destroy(); }catch(_){} hlsP = null; }
  video.removeAttribute('src'); [...video.querySelectorAll('track')].forEach(t => t.remove()); video.load();
}
function pmsg(t){ $('#pmsg').textContent = t || ''; }
const nextEp = () => {
  if(!P || P.live || !D || D.type !== 'series') return null;
  const s = D.seasons.find(x => x.number === P.se); if(!s) return null;
  if(s.episodes.includes(P.ep + 1)) return [P.se, P.ep + 1];
  const nx = D.seasons.find(x => x.number > P.se && x.episodes.length);
  return nx ? [nx.number, nx.episodes[0]] : null;
};
/* ---------- providers: MovieBox first, then the fallbacks ---------- */
let PROV = null, PCFG = {preferred: 'moviebox', on_missing: 'ask'};
async function provList(){
  if(!PROV){ try{ const r = await api('/api/providers'); PROV = r.providers; PCFG = {preferred: r.preferred, on_missing: r.on_missing}; }catch(_){ PROV = []; } }
  return PROV;
}
const provName = id => id === 'moviebox' ? 'MovieBox' : (((PROV || []).find(p => p.id === id)) || {}).name || id;
const cleanTitle = t => String(t || '').replace(/\s*\[[^\]]*\]/g, '').trim();

async function play(se, ep, replace, fresh){
  const my = ++playToken; if(P){ clearTimeout(P.nextTimer); clearTimeout(P.wd); }
  const h = hist()[D.id];
  P = {se, ep, subject: curSubject, streams: [], idx: 0, nextTimer: 0, wd: 0, sid: 0, tries: 0, settled: true, playing: false,
       live: false, ci: -1, chain: ['moviebox'], prov: 'moviebox', found: false, diag: '', missed: new Set(),
       pendingSeek: (!fresh && h && h.se === se && h.ep === ep && h.t > 10 && (!h.dur || h.t < h.dur * .95)) ? h.t : 0};
  stopHero();
  $('#player').style.display = 'flex'; $('#pprov').style.display = ''; hideMan();
  $('#ptitle').textContent = D.title + (se || ep ? `  S${se} E${ep}` : '');
  $('#pnext').style.display = nextEp() ? '' : 'none';
  $('#pstream').innerHTML = ''; $('#psub').innerHTML = '<option value="-1">Subtitles: loading…</option>';
  destroyEngines(); pmsg('Finding streams…');
  if(replace) history.replaceState({player: 1}, ''); else history.pushState({player: 1}, '');
  const pl = await provList(); if(my !== playToken) return;
  const ok = pl.filter(p => p.enabled && p.ready).map(p => p.id);
  const first = ok.includes(PCFG.preferred) ? PCFG.preferred : ok[0];
  P.chain = first ? [first, ...ok.filter(x => x !== first)] : ['moviebox'];   // your chosen provider goes first
  nextProvider(my, '');
}
function streamsURL(pv){
  const q = `se=${P.se}&ep=${P.ep}`;
  return pv === 'moviebox' ? `/api/streams?id=${encodeURIComponent(P.subject)}&${q}`
    : `/api/streams?p=${pv}&title=${encodeURIComponent(D.title)}&year=${encodeURIComponent(D.year || '')}&type=${D.type}&${q}`;
}
// walk the provider list until one returns streams. If the provider you chose has no such title, ask (or go on by itself, per settings)
async function nextProvider(my, why){
  const initial = !why;
  while(++P.ci < P.chain.length){
    const pv = P.chain[P.ci];
    pmsg((why ? why + '\n' : '') + (P.ci === 0 ? 'Finding streams…' : `Trying ${provName(pv)}…`)); why = '';
    let r = null;
    try{ r = await api(streamsURL(pv)); }
    catch(e){ if(my !== playToken) return; if(pv === 'moviebox') P.diag = e.diag || ''; }
    if(my !== playToken) return;
    if(r && r.streams && r.streams.length){ useStreams(my, pv, r.streams); return; }
    P.missed.add(pv);
    if(initial && P.ci === 0 && PCFG.on_missing === 'ask' && P.chain.length > 1){ showMan(`${provName(pv)} does not have this title. Switch to:`); return; }
  }
  showMan(P.found ? 'None of the sources could be played. Try another provider:' : 'This title was not found on any provider. Pick one and search:');
}
async function switchTo(pv){
  const my = playToken; hideMan(); pmsg(`Trying ${provName(pv)}…`);
  let r = null;
  try{ r = await api(streamsURL(pv)); }catch(e){ if(pv === 'moviebox') P.diag = e.diag || ''; }
  if(my !== playToken) return;
  if(r && r.streams && r.streams.length) return useStreams(my, pv, r.streams);
  P.missed.add(pv); showMan(`${provName(pv)} does not have it either. Pick another:`);
}
function useStreams(my, pv, streams){
  P.prov = pv; P.streams = streams; P.found = true; P.tries = 0; hideMan();
  $('#pstream').innerHTML = streams.map((s, i) => `<option value="${i}">${esc(s.label)}${s.size ? ' · ' + Math.max(1, Math.round(s.size / 1048576)) + ' MB' : ''}</option>`).join('');
  startStream(0, my);
  if(pv === 'moviebox') loadSubs(my); else $('#psub').innerHTML = '<option value="-1">No subtitles</option>';
}
// a source that will not start: next quality/source of this provider (3 tries), then the next provider
function streamFailed(sid, why){
  if(!P || P.sid !== sid || P.settled || P.playing) return;
  P.settled = true; clearTimeout(P.wd);
  if(P.live){ pmsg('This channel could not be played right now.'); return; }
  const my = playToken; P.tries++;
  if(P.tries < 3 && P.idx + 1 < P.streams.length){ pmsg(`That source failed (${why}). Trying the next one…`); startStream(P.idx + 1, my); }
  else nextProvider(my, `${provName(P.prov)} could not play it (${why}).`);
}
async function startStream(i, my){
  if(i !== P.idx && video.currentTime > 3) P.pendingSeek = video.currentTime;
  P.idx = i; const st = P.streams[i]; const sid = ++P.sid; P.settled = false; P.playing = false;
  $('#pstream').value = i;
  clearTimeout(P.wd); P.wd = setTimeout(() => streamFailed(sid, 'no response'), 40000);
  destroyEngines(); pmsg('Loading video…');
  try{
    if(st.kind === 'dash'){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js');
      if(my !== playToken) return;
      dashP = dashjs.MediaPlayer().create();
      dashP.initialize(video, st.src, true);
      dashP.on('error', e => { if(P.playing) pmsg('Playback error: ' + (e.error && e.error.message || 'unknown')); else streamFailed(sid, 'stream error'); });
    }else if(st.kind === 'hls'){
      if(video.canPlayType('application/vnd.apple.mpegurl')) video.src = st.src;
      else{
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js');
        if(my !== playToken) return;
        hlsP = new Hls(); hlsP.loadSource(st.src); hlsP.attachMedia(video);
        hlsP.on(Hls.Events.ERROR, (_, d) => { if(!d.fatal) return; if(P.playing) pmsg('Playback error: ' + d.details); else streamFailed(sid, 'stream error'); });
      }
    }else{ video.src = st.src; }
    video.playbackRate = +$('#pspeed').value;
    await video.play().catch(() => {});
  }catch(e){ streamFailed(sid, 'could not start'); }
}
/* manual provider picker: shown when no provider has the title, or on request */
function hideMan(){ $('#pman').style.display = 'none'; }
function showMan(msg){
  pmsg(''); clearTimeout(P && P.wd);
  provList().then(pl => {
    const opts = pl.filter(p => p.enabled && p.ready);
    $('#pmh').textContent = opts.length ? msg : 'No other providers are turned on. Open ⚙ to enable some.';
    const skip = new Set([...(P ? P.missed : [])].concat(P && P.found ? [P.prov] : []));
    $('#pmsw').innerHTML = opts.filter(p => !skip.has(p.id)).map(p => `<button class="btn red sm" data-sw="${p.id}">Try ${esc(p.name)}</button>`).join('');
    $('#pmp').innerHTML = opts.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    $('#pmq').value = cleanTitle(D && D.title); $('#pmr').innerHTML = '';
    $('#pman').style.display = 'block';
    if(P && P.diag) $('#pmr').innerHTML = `<details><summary><small>Technical details</small></summary><small style="word-break:break-all">${esc(P.diag)}</small></details>`;
  });
}
async function manSearch(){
  const q = $('#pmq').value.trim(), p = $('#pmp').value; if(!q || !p) return;
  $('#pmr').innerHTML = '<small>Searching…</small>';
  try{
    const r = await api(`/api/psearch?p=${p}&q=${encodeURIComponent(q)}`);
    $('#pmr').innerHTML = r.items.length ? r.items.map(i => `<button data-p="${esc(p)}" data-pid="${esc(i.pid)}">${esc(i.title)}<small>${esc([i.year, i.type].filter(Boolean).join(' · '))}</small></button>`).join('') : '<small>Nothing found there. Try another spelling or provider.</small>';
  }catch(e){ $('#pmr').innerHTML = `<small>${esc(e.message)}</small>`; }
}
async function manPick(p, pid){
  const my = playToken; hideMan(); pmsg(`Loading from ${provName(p)}…`);
  try{
    if(p === 'moviebox') P.subject = pid;
    const r = await api(p === 'moviebox' ? `/api/streams?id=${encodeURIComponent(pid)}&se=${P.se}&ep=${P.ep}` : `/api/streams?p=${p}&pid=${encodeURIComponent(pid)}&se=${P.se}&ep=${P.ep}`);
    if(my !== playToken) return;
    if(r.streams && r.streams.length) return useStreams(my, p, r.streams);
  }catch(_){}
  if(my === playToken) showMan(`No playable files there${P.se ? ` for S${P.se} E${P.ep}` : ''}. Pick another result or provider:`);
}
$('#pmgo').onclick = manSearch;
$('#pmq').addEventListener('keydown', e => { if(e.key === 'Enter') manSearch(); });
$('#pmr').addEventListener('click', e => { const b = e.target.closest('button[data-pid]'); if(b) manPick(b.dataset.p, b.dataset.pid); });
$('#pmx').onclick = hideMan;
$('#pmsw').addEventListener('click', e => { const b = e.target.closest('button[data-sw]'); if(b) switchTo(b.dataset.sw); });
$('#pprov').onclick = () => { if(P && !P.live) showMan('Choose a provider and search:'); };

/* live TV */
async function playLive(i, name){
  const my = ++playToken; if(P){ clearTimeout(P.nextTimer); clearTimeout(P.wd); }
  P = {live: true, streams: [], idx: 0, sid: 0, tries: 0, settled: true, playing: false, nextTimer: 0, wd: 0, pendingSeek: 0, chain: [], ci: 0, prov: 'tv'};
  stopHero(); $('#player').style.display = 'flex'; hideMan(); $('#pprov').style.display = 'none';
  $('#ptitle').textContent = name; $('#pnext').style.display = 'none';
  $('#pstream').innerHTML = ''; $('#psub').innerHTML = '<option value="-1">No subtitles</option>';
  destroyEngines(); pmsg('Tuning…'); history.pushState({player: 1}, '');
  try{ const r = await api('/api/tv/play?i=' + i); if(my !== playToken) return; P.streams = r.streams; startStream(0, my); }
  catch(e){ if(my === playToken) pmsg('Channel unavailable: ' + e.message); }
}

video.addEventListener('loadedmetadata', () => { if(P && P.pendingSeek){ video.currentTime = P.pendingSeek; P.pendingSeek = 0; } video.playbackRate = +$('#pspeed').value; });
video.addEventListener('playing', () => { pmsg(''); if(P){ P.playing = true; P.tries = 0; clearTimeout(P.wd); } });
video.addEventListener('loadeddata', () => { if(P) clearTimeout(P.wd); });
video.addEventListener('error', () => { if(!video.getAttribute('src') || !P) return; if(P.playing) pmsg('Playback error. Try another source from the list.'); else streamFailed(P.sid, 'could not decode'); });
$('#pstream').onchange = e => { P.tries = 0; startStream(+e.target.value, playToken); };

function saveProgress(force){
  if(!P || P.live || !D || !video.duration || !isFinite(video.duration) || video.currentTime < 3) return;
  const now = Date.now(); if(!force && now - lastSave < 4000) return; lastSave = now;
  const h = hist(), done = video.currentTime / video.duration;
  if(done > .9 && D.type === 'series'){ const sn = seen(); const k = P.se + 'x' + P.ep; (sn[D.id] ||= []); if(!sn[D.id].includes(k)) sn[D.id].push(k); ls.set('mb_seen', sn); }
  if(done > .95){
    const nx = nextEp();
    if(nx) h[D.id] = {id: D.id, title: D.title, poster: D.poster, type: D.type, year: D.year, se: nx[0], ep: nx[1], t: 0, dur: 0, ts: now, subject: P.subject};
    else delete h[D.id];
  }else h[D.id] = {id: D.id, title: D.title, poster: D.poster, type: D.type, year: D.year, se: P.se, ep: P.ep, t: video.currentTime, dur: video.duration, ts: now, subject: P.subject};
  ls.set('mb_hist', h);
}
video.addEventListener('timeupdate', () => saveProgress(false));
video.addEventListener('pause', () => saveProgress(true));
video.addEventListener('ended', () => {
  saveProgress(true);
  const nx = nextEp();
  if(nx && $('#pauto').checked){
    let n = 4; const tick = () => { if(n <= 0){ play(nx[0], nx[1], true, true); return; } pmsg(`Next: S${nx[0]} E${nx[1]} in ${n}s — press Back to stop`); n--; P.nextTimer = setTimeout(tick, 1000); };
    tick();
  }else pmsg(nx ? 'Finished' : 'The end');
});

async function loadSubs(my){
  const rid = (P.streams.find(s => s.resource_id) || {}).resource_id || '';
  const sibs = (D.dubs || []).map(d => d.id).filter(Boolean).join(',');
  try{
    const r = await api(`/api/captions?id=${encodeURIComponent(P.subject)}&rid=${encodeURIComponent(rid)}&se=${P.se}&ep=${P.ep}&sibs=${encodeURIComponent(sibs)}`);
    if(my !== playToken) return;
    r.captions.forEach(c => {
      const t = document.createElement('track');
      t.kind = 'subtitles'; t.label = c.name; t.src = c.src; t.srclang = (c.name || '').slice(0, 2).toLowerCase();
      video.appendChild(t);
    });
    if(!r.captions.length){ $('#psub').innerHTML = '<option value="-1">No subtitles</option>'; return; }
    $('#psub').innerHTML = '<option value="-1">Subtitles: off</option>' + r.captions.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join('');
    const want = ls.get('mb_sublang', 'english').toLowerCase();
    let idx = r.captions.findIndex(c => c.name.toLowerCase() === want);
    if(idx < 0 && want !== 'off') idx = r.captions.findIndex(c => /english/i.test(c.name));
    if(want === 'off') idx = -1;
    $('#psub').value = idx; setSub(idx);
  }catch(_){ $('#psub').innerHTML = '<option value="-1">No subtitles</option>'; }
}
function setSub(i){ [...video.textTracks].forEach((t, k) => t.mode = (k === i ? 'showing' : 'disabled')); }
$('#psub').onchange = e => { const i = +e.target.value; setSub(i); ls.set('mb_sublang', i < 0 ? 'off' : e.target.selectedOptions[0].textContent); };
$('#pnext').onclick = () => { const nx = nextEp(); if(nx){ saveProgress(true); play(nx[0], nx[1], true, true); } };

document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { video.currentTime = Math.max(0, video.currentTime + +b.dataset.seek); });
$('#pspeed').onchange = e => video.playbackRate = +e.target.value;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('#pfs').onclick = () => { const p = $('#player'); if(fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else (p.requestFullscreen || p.webkitRequestFullscreen || (() => {})).call(p); };
video.addEventListener('dblclick', e => {
  const x = e.offsetX / video.clientWidth;
  if(x < .33) video.currentTime -= 10; else if(x > .66) video.currentTime += 10; else $('#pfs').click();
});
document.addEventListener('keydown', e => {
  if($('#player').style.display === 'none' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key;
  if(k === ' ' || k === 'k'){ e.preventDefault(); video.paused ? video.play() : video.pause(); }
  else if(k === 'ArrowRight'){ video.currentTime += 10; } else if(k === 'ArrowLeft'){ video.currentTime -= 10; }
  else if(k === 'ArrowUp'){ video.volume = Math.min(1, video.volume + .1); e.preventDefault(); } else if(k === 'ArrowDown'){ video.volume = Math.max(0, video.volume - .1); e.preventDefault(); }
  else if(k === 'f'){ $('#pfs').click(); } else if(k === 'm'){ video.muted = !video.muted; }
  else if(k === 'n'){ $('#pnext').click(); } else if(k === 's'){ video.currentTime += 85; }
  else if(k === 'Escape' && !fsEl()){ history.back(); }
});
function closePlayer(){ saveProgress(true); if(P){ clearTimeout(P.nextTimer); clearTimeout(P.wd); } hideMan(); playToken++; destroyEngines(); pmsg(''); $('#player').style.display = 'none'; if(fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); if(D && D.type === 'series' && $('#seriesBox')) renderSeries(); else if(D && $('#detail').style.display === 'block') showDetail(D.id); }
$('#pclose').onclick = () => history.back();
window.addEventListener('popstate', () => { if($('#player').style.display !== 'none') closePlayer(); else route(); });

/* ---------- TV / keyboard navigation (arrow keys move focus) ---------- */
document.addEventListener('keydown', e => {
  if($('#player').style.display !== 'none' || !/^Arrow/.test(e.key) || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const els = [...document.querySelectorAll('.card, .ch, .eps button, main .btn, #hero .btn, main select, #logo, #nHome, #navfav, #nTv, #gear')].filter(el => el.offsetParent);
  const cur = document.activeElement && els.includes(document.activeElement) ? document.activeElement : null;
  if(!cur){ if(els.length){ els[0].focus(); e.preventDefault(); } return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bd = 1e9;
  for(const el of els){
    if(el === cur) continue;
    const b = el.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2, dx = x - cx, dy = y - cy;
    const ok = e.key === 'ArrowRight' ? dx > 5 && Math.abs(dy) < r.height : e.key === 'ArrowLeft' ? dx < -5 && Math.abs(dy) < r.height
             : e.key === 'ArrowDown' ? dy > 5 && Math.abs(dx) < Math.max(r.width, 120) * 1.5 : dy < -5 && Math.abs(dx) < Math.max(r.width, 120) * 1.5;
    if(!ok) continue;
    const d = dx * dx + dy * dy; if(d < bd){ bd = d; best = el; }
  }
  if(best){ best.focus({preventScroll: true}); best.scrollIntoView({block: 'center', inline: 'nearest', behavior: 'smooth'}); e.preventDefault(); }
});

/* ---------- live TV ---------- */
async function showTV(){
  showView('list'); setNav();
  $('#list').innerHTML = `<h2 class="sec">Live TV</h2><div class="tvbar"><input id="tvq" type="search" placeholder="Search channels" autocomplete="off"><select id="tvg"><option value="">All groups</option></select></div>
    <div id="tvinfo"></div><div class="tvgrid" id="tvgrid"></div><div class="more" id="tvmore"></div>`;
  let page = 1, busy = false, done = false, q = '', g = '', first = true, io = null;
  const load = async reset => {
    if(busy) return; busy = true;
    if(reset){ page = 1; done = false; $('#tvgrid').innerHTML = ''; }
    try{
      const r = await api(`/api/tv/channels?q=${encodeURIComponent(q)}&group=${encodeURIComponent(g)}&page=${page}`);
      if(first){
        first = false;
        $('#tvg').insertAdjacentHTML('beforeend', r.groups.map(x => `<option>${esc(x)}</option>`).join(''));
        if(!r.configured) $('#tvinfo').innerHTML = '<div class="msg" style="padding:30px var(--pad)">No playlist yet.<br><br><button class="btn red" id="tvadd">Add a playlist</button></div>';
        else if(r.errors.length && !r.total) $('#tvinfo').innerHTML = `<div class="msg" style="padding:30px var(--pad)">Could not load the playlist (${esc(r.errors.join(', '))}).</div>`;
      }
      $('#tvgrid').insertAdjacentHTML('beforeend', r.items.map(c => `<div class="ch" tabindex="0" data-i="${c.i}" data-n="${esc(c.name)}"><div class="lg">${c.logo ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(im(c.logo, 160))}" alt="">` : esc((c.name || '?')[0])}</div><b>${esc(c.name)}</b><span>${esc(c.group)}</span></div>`).join(''));
      done = !r.more; page++;
    }catch(e){ $('#tvinfo').innerHTML = `<div class="msg">${esc(e.message)}</div>`; done = true; }
    busy = false;
  };
  await load(true);
  if('IntersectionObserver' in window){ io = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting) && !done) load(false); }, {rootMargin: '600px'}); io.observe($('#tvmore')); }
  let t = 0;
  $('#tvq').oninput = e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value.trim().toLowerCase(); load(true); }, 250); };
  $('#tvg').onchange = e => { g = e.target.value; load(true); };
}
document.addEventListener('click', e => {
  const c = e.target.closest('.ch'); if(c){ playLive(+c.dataset.i, c.dataset.n); return; }
  if(e.target.id === 'tvadd') openCfg();
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('ch')) e.target.click(); });

/* ---------- settings ---------- */
let CF = null;
function renderCfg(c){
  CF = c;
  $('#cfprov').innerHTML = c.providers.map(p => `<div class="pl-row"><label style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" data-pv="${p.id}" ${p.enabled ? 'checked' : ''}> ${esc(p.name)}</label>${!p.ready ? `<span>— ${esc(p.note)}</span>` : ''}</div>`).join('');
  $('#cfpref').innerHTML = c.providers.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('#cfpref').value = c.preferred; $('#cfmiss').value = c.on_missing;
  $('#cfadd').value = c.addons.join('\n'); $('#cftv').value = c.tv_playlists.join('\n'); $('#cf4k').value = c.fourkhdhub_url || '';
}
async function openCfg(){
  $('#cfmsg').textContent = ''; $('#cfg').showModal();
  try{ renderCfg(await api('/api/config')); }catch(e){ $('#cfmsg').textContent = e.message; }
}
$('#gear').onclick = openCfg;
$('#gear').onkeydown = e => { if(e.key === 'Enter') openCfg(); };
$('#cfx').onclick = () => $('#cfg').close();
$('#cfsave').onclick = async () => {
  const lines = id => $(id).value.split('\n').map(s => s.trim()).filter(Boolean);
  const en = {}; document.querySelectorAll('#cfprov [data-pv]').forEach(c => en[c.dataset.pv] = c.checked);
  if(!Object.values(en).some(Boolean)){ $('#cfmsg').textContent = 'Keep at least one provider on.'; return; }
  if(!en[$('#cfpref').value]){ $('#cfmsg').textContent = 'The provider you play from first must be turned on.'; return; }
  const want = {addons: lines('#cfadd'), tv_playlists: lines('#cftv')};
  try{
    const r = await (await fetch('/api/config', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({enabled: en, preferred: $('#cfpref').value, on_missing: $('#cfmiss').value, ...want, fourkhdhub_url: $('#cf4k').value.trim()})})).json();
    PROV = null; renderCfg(r);
    const dropped = want.addons.length + want.tv_playlists.length - r.addons.length - r.tv_playlists.length;
    $('#cfmsg').textContent = dropped > 0 ? `Saved. ${dropped} link(s) ignored (must be public http/https).` : 'Saved.';
    if(location.hash === '#/tv') route();
  }catch(e){ $('#cfmsg').textContent = 'Could not save: ' + e.message; }
};

/* ---------- routing ---------- */
function route(){
  const h = location.hash || '#/'; let m;
  if((m = h.match(/^#\/d\/([^/]+)(?:\/r\/(\d+\/\d+))?$/))) return showDetail(decodeURIComponent(m[1]), m[2]);
  if((m = h.match(/^#\/s\/(.+)$/))) return showSearch(decodeURIComponent(m[1]));
  if(h === '#/fav') return showFav();
  if(h === '#/tv') return showTV();
  showHome();
}
window.addEventListener('hashchange', () => { if($('#player').style.display === 'none') route(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && H.timer) startHero(); });
route();
